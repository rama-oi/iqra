[package]
name = "iqra-server"
description = "REST API and static files of Iqra"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "iqra"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
axum = "0.8.9"
clap = { version = "4.6.7", features = ["derive", "env"] }
iqra-core = { version = "0.1.0", path = "../core" }
mime_guess = "2.0.5"
rust-embed = { version = "8.14.0", features = ["include-exclude"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[dev-dependencies]
http-body-util = "0.1.5"
tempfile = "3.27.0"
tower = "0.5.3"
